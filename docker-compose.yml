services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sow
      POSTGRES_PASSWORD: sow
      POSTGRES_DB: sow_platform
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sow -d sow_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Dev-only: a web UI onto the same Postgres, for looking at the tables
  # directly. The Streamlit app shows the plan; this shows the rows behind it.
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      # The System box still has to be switched to PostgreSQL by hand: this
      # image honours ADMINER_DEFAULT_SERVER but not ADMINER_DEFAULT_DRIVER, so
      # it opens on MySQL. Leaving it there fails as "Connection refused",
      # which reads like the database is down rather than like the wrong
      # protocol was spoken to it.
      ADMINER_DESIGN: dracula
    depends_on:
      - postgres

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data

volumes:
  pg_data:
  chroma_data:
