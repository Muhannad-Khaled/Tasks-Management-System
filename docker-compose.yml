services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sow
      POSTGRES_PASSWORD: sow
      POSTGRES_DB: sow_platform
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sow -d sow_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data

volumes:
  pg_data:
  chroma_data:
